<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c182e"/>
      <stop offset="60%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="steelPylon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="wireSpark">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Atmospheric Sky Background -->
  <rect x="0" y="0" width="400" height="220" fill="url(#skyGrad)"/>

  <!-- Distant Substation Yard Silhouettes -->
  <rect x="20" y="160" width="75" height="42" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <!-- Substation Radiator Cooling Fins -->
  <line x1="28" y1="168" x2="28" y2="195" stroke="#475569" stroke-width="2"/>
  <line x1="38" y1="168" x2="38" y2="195" stroke="#475569" stroke-width="2"/>
  <line x1="48" y1="168" x2="48" y2="195" stroke="#475569" stroke-width="2"/>
  <line x1="58" y1="168" x2="58" y2="195" stroke="#475569" stroke-width="2"/>
  <!-- Transformer Bushings -->
  <rect x="35" y="145" width="6" height="15" fill="#f59e0b"/>
  <rect x="55" y="145" width="6" height="15" fill="#f59e0b"/>

  <!-- High-Voltage Steel Lattice Pylon (Centerpiece) -->
  <!-- Main Tapered Legs -->
  <line x1="200" y1="20" x2="155" y2="202" stroke="url(#steelPylon)" stroke-width="3.5"/>
  <line x1="200" y1="20" x2="245" y2="202" stroke="url(#steelPylon)" stroke-width="3.5"/>
  
  <!-- Cross Bracing (X-trusses) -->
  <g stroke="url(#steelPylon)" stroke-width="1.8">
    <line x1="190" y1="50" x2="210" y2="50"/>
    <line x1="184" y1="80" x2="216" y2="80"/>
    <line x1="175" y1="118" x2="225" y2="118"/>
    <line x1="165" y1="160" x2="235" y2="160"/>
    
    <!-- X-diagonals -->
    <line x1="190" y1="50" x2="216" y2="80"/>
    <line x1="210" y1="50" x2="184" y2="80"/>
    <line x1="184" y1="80" x2="225" y2="118"/>
    <line x1="216" y1="80" x2="175" y2="118"/>
    <line x1="175" y1="118" x2="235" y2="160"/>
    <line x1="225" y1="118" x2="165" y2="160"/>
    <line x1="165" y1="160" x2="245" y2="202"/>
    <line x1="235" y1="160" x2="155" y2="202"/>
  </g>

  <!-- Pylon Upper Cross-Arm (High-Span) -->
  <line x1="110" y1="58" x2="290" y2="58" stroke="url(#steelPylon)" stroke-width="3.2"/>
  <line x1="110" y1="58" x2="185" y2="80" stroke="url(#steelPylon)" stroke-width="2"/>
  <line x1="290" y1="58" x2="215" y2="80" stroke="url(#steelPylon)" stroke-width="2"/>

  <!-- Pylon Lower Cross-Arm -->
  <line x1="130" y1="96" x2="270" y2="96" stroke="url(#steelPylon)" stroke-width="3"/>
  <line x1="130" y1="96" x2="178" y2="118" stroke="url(#steelPylon)" stroke-width="2"/>
  <line x1="270" y1="96" x2="222" y2="118" stroke="url(#steelPylon)" stroke-width="2"/>

  <!-- Ceramic Disc Insulators Strings -->
  <g fill="#38bdf8" stroke="#0284c7" stroke-width="0.8">
    <!-- Left Top -->
    <rect x="113" y="58" width="6" height="16" rx="2"/>
    <circle cx="116" cy="74" r="3" fill="#fbbf24"/>
    <!-- Right Top -->
    <rect x="281" y="58" width="6" height="16" rx="2"/>
    <circle cx="284" cy="74" r="3" fill="#fbbf24"/>
    <!-- Left Mid -->
    <rect x="133" y="96" width="6" height="16" rx="2"/>
    <circle cx="136" cy="112" r="3" fill="#fbbf24"/>
    <!-- Right Mid -->
    <rect x="261" y="96" width="6" height="16" rx="2"/>
    <circle cx="264" cy="112" r="3" fill="#fbbf24"/>
  </g>

  <!-- 3-Phase Transmission Power Lines (Conductors Catenary) -->
  <path d="M 0 54 Q 55 76, 116 74 Q 160 72, 284 74 Q 345 76, 400 54" fill="none" stroke="#f59e0b" stroke-width="1.8" filter="url(#wireSpark)"/>
  <path d="M 0 92 Q 65 114, 136 112 Q 200 110, 264 112 Q 335 114, 400 92" fill="none" stroke="#38bdf8" stroke-width="1.8" filter="url(#wireSpark)"/>
  <path d="M 0 130 Q 100 148, 200 148 Q 300 148, 400 130" fill="none" stroke="#10b981" stroke-width="1.8"/>

  <!-- Ground Grid Concrete Foundations -->
  <rect x="145" y="198" width="22" height="10" fill="#475569"/>
  <rect x="233" y="198" width="22" height="10" fill="#475569"/>
  
  <!-- Substation High-Voltage Sign -->
  <rect x="300" y="170" width="70" height="25" rx="3" fill="#b91c1c" stroke="#f87171" stroke-width="1"/>
  <text x="335" y="186" fill="#fff" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">KPTCL 400 kV</text>
</svg>