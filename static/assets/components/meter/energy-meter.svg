<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="mtrCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="lcdBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <filter id="mtrGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="200" cy="204" rx="130" ry="12" fill="#000" opacity="0.45"/>

  <!-- Polycarbonate Meter Case Enclosure -->
  <rect x="95" y="25" width="210" height="175" rx="14" fill="url(#mtrCase)" stroke="#475569" stroke-width="2.5"/>
  <rect x="105" y="35" width="190" height="155" rx="8" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Backlit Dot-Matrix Telemetry LCD Screen -->
  <rect x="115" y="46" width="170" height="78" rx="6" fill="url(#lcdBack)" stroke="#059669" stroke-width="1.8"/>
  <rect x="118" y="49" width="164" height="72" rx="4" fill="none" stroke="#10b981" stroke-width="0.8" opacity="0.5"/>

  <!-- LCD Readouts -->
  <text x="128" y="66" fill="#34d399" font-family="monospace" font-size="8.5" font-weight="bold">ACTIVE IMPORT (kW):</text>
  <text x="272" y="68" fill="#6ee7b7" font-family="monospace" font-size="14" font-weight="bold" text-anchor="end" filter="url(#mtrGlow)">+8.40 kW</text>

  <text x="128" y="86" fill="#34d399" font-family="monospace" font-size="8.5" font-weight="bold">TOTAL kWh:</text>
  <text x="272" y="88" fill="#6ee7b7" font-family="monospace" font-size="13" font-weight="bold" text-anchor="end">0014.82 kWh</text>

  <!-- Direction Indicator / Status Pill on LCD -->
  <rect x="128" y="98" width="85" height="16" rx="3" fill="#065f46"/>
  <text x="170" y="110" fill="#a7f3d0" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">GRID ➔ EV (G2V)</text>
  <text x="272" y="110" fill="#fbbf24" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="end">50.06 Hz</text>

  <!-- Optical Communication Port (Round) -->
  <circle cx="145" cy="145" r="9" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="145" cy="145" r="4" fill="#38bdf8"/>

  <!-- Calibration Pulse LEDs -->
  <circle cx="185" cy="145" r="3.5" fill="#f43f5e" filter="url(#mtrGlow)"/>
  <text x="185" y="157" fill="#94a3b8" font-family="monospace" font-size="6" text-anchor="middle">1000 imp</text>

  <circle cx="215" cy="145" r="3.5" fill="#10b981" filter="url(#mtrGlow)"/>
  <text x="215" y="157" fill="#94a3b8" font-family="monospace" font-size="6" text-anchor="middle">ALARM</text>

  <!-- Tamper Wire Seal -->
  <circle cx="265" cy="145" r="6" fill="#dc2626" stroke="#991b1b" stroke-width="1"/>
  <line x1="265" y1="135" x2="265" y2="155" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- High-Current Terminal Blocks (L1, L2, L3, N) at bottom -->
  <rect x="110" y="172" width="180" height="24" rx="4" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
  <!-- Terminal Screws -->
  <circle cx="130" cy="184" r="5" fill="#b45309" stroke="#fbbf24" stroke-width="1.2"/>
  <circle cx="165" cy="184" r="5" fill="#b45309" stroke="#fbbf24" stroke-width="1.2"/>
  <circle cx="200" cy="184" r="5" fill="#b45309" stroke="#fbbf24" stroke-width="1.2"/>
  <circle cx="235" cy="184" r="5" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.2"/>
  <circle cx="270" cy="184" r="5" fill="#475569" stroke="#cbd5e1" stroke-width="1.2"/>
</svg>