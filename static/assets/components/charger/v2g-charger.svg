<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="chgBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chgGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cableOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="chgGlow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="200" cy="204" rx="145" ry="12" fill="#000" opacity="0.45"/>

  <!-- Pedestal Main Tower Enclosure -->
  <path d="M 125 32 L 275 32 L 285 195 L 115 195 Z" fill="url(#chgBody)" stroke="#475569" stroke-width="2.5"/>

  <!-- Top Status Beacon Light Bar -->
  <path d="M 133 32 L 267 32 L 265 42 L 135 42 Z" fill="#10b981" filter="url(#chgGlow)"/>
  <rect x="135" y="34" width="130" height="5" rx="2" fill="#6ee7b7"/>

  <!-- Illuminated Interactive LCD Screen -->
  <rect x="145" y="55" width="110" height="65" rx="6" fill="#090e1a" stroke="#0284c7" stroke-width="1.8"/>
  <rect x="148" y="58" width="104" height="59" rx="4" fill="#031525"/>
  <!-- Power sine / flow waveform -->
  <path d="M 152 88 Q 165 72, 178 88 T 204 88 T 230 88 T 248 88" fill="none" stroke="#38bdf8" stroke-width="2" filter="url(#chgGlow)"/>
  <text x="200" y="70" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">V2G BIDIRECTIONAL</text>
  <text x="200" y="106" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">+8.4 kW / 22 kW</text>

  <!-- RFID Tap Card Area & E-Stop Button -->
  <rect x="155" y="130" width="34" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <path d="M 166 137 A 6 6 0 0 1 178 137 M 169 141 A 3 3 0 0 1 175 141" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Emergency Stop Button -->
  <circle cx="230" cy="141" r="10" fill="#facc15" stroke="#a16207" stroke-width="1"/>
  <circle cx="230" cy="141" r="7.5" fill="#dc2626" stroke="#991b1b" stroke-width="1.2"/>

  <!-- Cooling Air Intake Louvers -->
  <g stroke="#0f172a" stroke-width="2.5" stroke-linecap="round">
    <line x1="145" y1="168" x2="255" y2="168"/>
    <line x1="145" y1="174" x2="255" y2="174"/>
    <line x1="145" y1="180" x2="255" y2="180"/>
  </g>

  <!-- Side Charging Cable & Heavy CCS Connector -->
  <!-- Cable Loop -->
  <path d="M 120 120 C 70 120, 60 185, 100 190 C 130 193, 85 145, 95 105" fill="none" stroke="url(#cableOrange)" stroke-width="12" stroke-linecap="round"/>
  <!-- CCS Heavy Gun / Plug in Holster -->
  <rect x="80" y="85" width="28" height="42" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.8" transform="rotate(-15 94 106)"/>
  <rect x="74" y="98" width="14" height="20" rx="3" fill="#0f172a" transform="rotate(-15 94 106)"/>
  <!-- Plug Release Latch -->
  <rect x="98" y="82" width="7" height="14" rx="2" fill="#38bdf8" transform="rotate(-15 94 106)"/>

  <!-- Model & CE Branding Badge -->
  <rect x="180" y="186" width="40" height="7" rx="1.5" fill="#0f172a"/>
  <text x="200" y="192" fill="#94a3b8" font-family="sans-serif" font-size="5.5" font-weight="bold" text-anchor="middle">CCS-2 / CHAdeMO</text>
</svg>