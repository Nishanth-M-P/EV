<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="decBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="decGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Enclosure -->
  <rect x="25" y="25" width="350" height="170" rx="12" fill="url(#decBg)" stroke="#6366f1" stroke-width="2.2"/>

  <!-- Decision Relay Bank -->
  <rect x="45" y="45" width="310" height="50" rx="8" fill="#0f172a" stroke="#312e81" stroke-width="1.5"/>
  <text x="60" y="75" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="bold">CONTROL DISPATCH:</text>
  <rect x="185" y="55" width="155" height="30" rx="5" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
  <text x="262" y="75" fill="#6ee7b7" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" filter="url(#decGlow)">CHARGE (+8.4 kW)</text>

  <!-- Logic Gate Flow Diagram -->
  <g stroke="#818cf8" stroke-width="1.8" fill="none">
    <path d="M 60 120 L 110 120 L 130 140 L 180 140"/>
    <path d="M 60 160 L 110 160 L 130 140"/>
    <circle cx="60" cy="120" r="4" fill="#a5b4fc"/>
    <circle cx="60" cy="160" r="4" fill="#a5b4fc"/>
    <circle cx="180" cy="140" r="4" fill="#10b981"/>
  </g>
  <text x="60" y="112" fill="#94a3b8" font-family="monospace" font-size="7.5">SOC Check</text>
  <text x="60" y="174" fill="#94a3b8" font-family="monospace" font-size="7.5">Tariff Check</text>

  <!-- Output Status Indicators -->
  <rect x="205" y="115" width="150" height="55" rx="6" fill="#0f172a" stroke="#3730a3" stroke-width="1"/>
  <text x="215" y="132" fill="#c7d2fe" font-family="monospace" font-size="8.5">DEPARTURE: <tspan fill="#34d399" font-weight="bold">GUARANTEED</tspan></text>
  <text x="215" y="148" fill="#c7d2fe" font-family="monospace" font-size="8.5">SAFETY GATE: <tspan fill="#38bdf8" font-weight="bold">PASSED</tspan></text>
  <text x="215" y="163" fill="#c7d2fe" font-family="monospace" font-size="8.5">FEEDER STRESS: <tspan fill="#facc15" font-weight="bold">LOW</tspan></text>
</svg>