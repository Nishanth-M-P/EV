<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="batTray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="busbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="dome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="200" cy="198" rx="175" ry="14" fill="#000" opacity="0.45"/>

  <!-- Battery Tray Exterior / Aluminum Ribbed Casing -->
  <rect x="25" y="32" width="350" height="155" rx="14" fill="url(#batTray)" stroke="#475569" stroke-width="2.5"/>
  <rect x="29" y="36" width="342" height="147" rx="10" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="8 6"/>

  <!-- Perimeter Hex Mounting Bolts -->
  <g fill="#94a3b8" stroke="#1e293b" stroke-width="0.8">
    <circle cx="40" cy="45" r="3.2"/><circle cx="100" cy="42" r="3.2"/><circle cx="160" cy="42" r="3.2"/>
    <circle cx="240" cy="42" r="3.2"/><circle cx="300" cy="42" r="3.2"/><circle cx="360" cy="45" r="3.2"/>
    <circle cx="40" cy="175" r="3.2"/><circle cx="100" cy="177" r="3.2"/><circle cx="160" cy="177" r="3.2"/>
    <circle cx="240" cy="177" r="3.2"/><circle cx="300" cy="177" r="3.2"/><circle cx="360" cy="175" r="3.2"/>
  </g>

  <!-- Transparent Polycarbonate Inspection Chamber -->
  <rect x="45" y="55" width="310" height="110" rx="8" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
  <rect x="45" y="55" width="310" height="110" rx="8" fill="url(#dome)"/>

  <!-- 6 Modular Cell Blocks Matrix -->
  <!-- Block 1 -->
  <rect x="58" y="66" width="42" height="40" rx="4" fill="url(#cellGrad)" stroke="#34d399" stroke-width="1.2"/>
  <line x1="68" y1="66" x2="68" y2="106" stroke="#047857" stroke-width="1"/><line x1="79" y1="66" x2="79" y2="106" stroke="#047857" stroke-width="1"/><line x1="90" y1="66" x2="90" y2="106" stroke="#047857" stroke-width="1"/>
  <text x="79" y="90" fill="#fff" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">M1</text>

  <!-- Block 2 -->
  <rect x="110" y="66" width="42" height="40" rx="4" fill="url(#cellGrad)" stroke="#34d399" stroke-width="1.2"/>
  <line x1="120" y1="66" x2="120" y2="106" stroke="#047857" stroke-width="1"/><line x1="131" y1="66" x2="131" y2="106" stroke="#047857" stroke-width="1"/><line x1="142" y1="66" x2="142" y2="106" stroke="#047857" stroke-width="1"/>
  <text x="131" y="90" fill="#fff" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">M2</text>

  <!-- Block 3 -->
  <rect x="162" y="66" width="42" height="40" rx="4" fill="url(#cellGrad)" stroke="#34d399" stroke-width="1.2"/>
  <line x1="172" y1="66" x2="172" y2="106" stroke="#047857" stroke-width="1"/><line x1="183" y1="66" x2="183" y2="106" stroke="#047857" stroke-width="1"/><line x1="194" y1="66" x2="194" y2="106" stroke="#047857" stroke-width="1"/>
  <text x="183" y="90" fill="#fff" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">M3</text>

  <!-- Block 4 -->
  <rect x="58" y="116" width="42" height="40" rx="4" fill="url(#cellGrad)" stroke="#34d399" stroke-width="1.2"/>
  <line x1="68" y1="116" x2="68" y2="156" stroke="#047857" stroke-width="1"/><line x1="79" y1="116" x2="79" y2="156" stroke="#047857" stroke-width="1"/><line x1="90" y1="116" x2="90" y2="156" stroke="#047857" stroke-width="1"/>
  <text x="79" y="140" fill="#fff" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">M4</text>

  <!-- Block 5 -->
  <rect x="110" y="116" width="42" height="40" rx="4" fill="url(#cellGrad)" stroke="#34d399" stroke-width="1.2"/>
  <line x1="120" y1="116" x2="120" y2="156" stroke="#047857" stroke-width="1"/><line x1="131" y1="116" x2="131" y2="156" stroke="#047857" stroke-width="1"/><line x1="142" y1="116" x2="142" y2="156" stroke="#047857" stroke-width="1"/>
  <text x="131" y="140" fill="#fff" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">M5</text>

  <!-- Block 6 -->
  <rect x="162" y="116" width="42" height="40" rx="4" fill="url(#cellGrad)" stroke="#34d399" stroke-width="1.2"/>
  <line x1="172" y1="116" x2="172" y2="156" stroke="#047857" stroke-width="1"/><line x1="183" y1="116" x2="183" y2="156" stroke="#047857" stroke-width="1"/><line x1="194" y1="116" x2="194" y2="156" stroke="#047857" stroke-width="1"/>
  <text x="183" y="140" fill="#fff" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">M6</text>

  <!-- Heavy Copper Inter-Module Busbars -->
  <path d="M 100 86 L 110 86 M 152 86 L 162 86 M 100 136 L 110 136 M 152 136 L 162 136 M 204 86 L 214 86 L 214 136 L 204 136" fill="none" stroke="url(#busbar)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- High-Voltage Manual Service Disconnect (MSD) Orange Plug -->
  <rect x="222" y="80" width="22" height="62" rx="4" fill="#ea580c" stroke="#f97316" stroke-width="1.5"/>
  <rect x="227" y="92" width="12" height="38" rx="2" fill="#c2410c"/>
  <circle cx="233" cy="111" r="3.5" fill="#fef08a"/>

  <!-- Integrated BMS Master Controller Board -->
  <rect x="254" y="66" width="90" height="90" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <rect x="264" y="74" width="32" height="32" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="280" y="93" fill="#38bdf8" font-family="monospace" font-size="7" font-weight="bold" text-anchor="middle">BMS-MCU</text>
  <!-- BMS Status LEDs -->
  <circle cx="315" cy="76" r="3" fill="#10b981" filter="url(#glow)"/>
  <circle cx="328" cy="76" r="3" fill="#38bdf8"/>
  <circle cx="315" cy="88" r="3" fill="#f59e0b"/>
  <circle cx="328" cy="88" r="3" fill="#10b981"/>
  <text x="299" y="145" fill="#a7f3d0" font-family="monospace" font-size="7.5" font-weight="bold" text-anchor="middle">72 kWh LiFePO4</text>
  <text x="299" y="124" fill="#34d399" font-family="monospace" font-size="7" text-anchor="middle">CAN 2.0B / 500k</text>

  <!-- Heavy-Duty High-Voltage Terminals (Top) -->
  <!-- Positive (+) Terminal -->
  <rect x="75" y="16" width="28" height="18" rx="3" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
  <circle cx="89" cy="24" r="5" fill="#f87171" stroke="#fff" stroke-width="1.2"/>
  <text x="89" y="27.5" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">+</text>

  <!-- Negative (-) Terminal -->
  <rect x="297" y="16" width="28" height="18" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="311" cy="24" r="5" fill="#64748b" stroke="#fff" stroke-width="1.2"/>
  <text x="311" y="27.5" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">−</text>

  <!-- ISO 7010 High Voltage Warning Placard -->
  <polygon points="198,18 212,42 184,42" fill="#facc15" stroke="#854d0e" stroke-width="1.2"/>
  <path d="M 199 26 L 195 33 L 198 33 L 196 39 L 202 32 L 199 32 Z" fill="#000"/>
</svg>